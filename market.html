<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>桃園成交行情 · 貝多房產</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--ink:#122238;--navy:#24395a;--gold:#c9a663;--gold-d:#9d7a38;--paper:#f6f2e8;--paper2:#efe8d9;--card:#fcfaf5;--line:#ddd4c2;--sub:#8a836f;--resale:#3f7d68;--orange:#c15a2b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans TC",sans-serif;background:var(--paper);color:var(--ink);line-height:1.65}
.serif{font-family:"Noto Serif TC",serif}.eng{font-family:"Cormorant Garamond",serif;letter-spacing:2px;color:var(--gold-d);font-size:12px;text-transform:uppercase}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
a{color:inherit;text-decoration:none}
.nav{border-bottom:1px solid var(--line);background:rgba(246,242,232,.92);position:sticky;top:0;z-index:20}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px}.brand span{color:var(--gold-d)}
.navlinks{display:flex;gap:22px;font-size:14px;color:var(--navy)}.navlinks a.on{color:var(--gold-d);font-weight:700}
.head{padding:30px 0 6px}.head h1{font-size:33px;font-weight:900}.head h1 span{color:var(--gold-d)}
.head .src{color:var(--sub);font-size:13px;margin-top:6px}
.ctrl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:22px 0 8px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.tabs button{padding:9px 22px;font-size:15px;font-weight:700;background:var(--card);border:none;cursor:pointer;color:var(--sub);font-family:inherit}
.tabs button.on{background:var(--ink);color:var(--paper)}
.msel{display:flex;align-items:center;gap:8px}.msel label{font-size:13px;color:var(--sub)}
select{font-family:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink)}
.badge{font-size:12px;padding:3px 10px;border-radius:3px;font-weight:700}
.badge.inc{background:#f6ead2;color:var(--gold-d)}.badge.ok{background:#e3f0ea;color:var(--resale)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}
.kpi .b{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.kpi .k{font-size:12.5px;color:var(--sub);margin-bottom:6px}
.kpi .v{font-family:"Noto Serif TC",serif;font-size:30px;font-weight:900;line-height:1.1}.kpi .v small{font-size:13px;color:var(--sub);font-weight:600}
.kpi .s{font-size:12.5px;color:var(--sub);margin-top:6px}
.up{color:#c0392b}.down{color:var(--resale)}.flat{color:var(--sub)}
.summary{background:var(--ink);color:var(--paper);border-radius:4px;padding:16px 20px;margin-bottom:20px;font-size:15px;line-height:1.9}
.summary b{color:var(--gold)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-bottom:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 20px}
.panel h3{font-family:"Noto Serif TC",serif;font-size:17px;margin-bottom:4px}
.panel .note{font-size:12px;color:var(--sub);margin-bottom:12px}
.chartbox{position:relative;height:280px}
.ranks{display:grid;grid-template-columns:1fr 1fr;gap:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--sub);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.rk{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;background:var(--paper2);color:var(--gold-d);border-radius:3px;font-size:12px;font-weight:700;margin-right:8px}
.dl{border-bottom:1px solid var(--line)}
.foot{color:var(--sub);font-size:12px;padding:8px 0 50px;line-height:1.9}
@media(max-width:820px){.kpi,.ranks{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.navlinks{display:none}}
</style>
</head>
<body>
<nav class="nav"><div class="wrap">
  <a class="brand" href="index.html">貝多<span>房產</span> · 桃園房市數據</a>
  <div class="navlinks"><a href="index.html">首頁</a><a class="on">成交行情</a><a href="index.html#about">資料方法</a><a href="index.html#about">關於貝多</a></div>
</div></nav>

<div class="wrap">
  <div class="head"><h1 class="serif">桃園<span>成交行情</span></h1><div class="src" id="src">載入中…</div></div>

  <div class="ctrl">
    <div class="tabs"><button id="tPre" class="on" onclick="setType('presale')">預售屋</button><button id="tRes" onclick="setType('resale')">中古屋（乾淨行情）</button></div>
    <div class="msel"><label>交易月份</label><select id="msel" onchange="pickMonth(this.value)"></select><span id="mbadge"></span></div>
  </div>

  <div class="kpi" id="kpi"></div>
  <div class="summary" id="summary"></div>

  <div class="grid2">
    <div class="panel"><h3 id="ctitle">成交量與中位單價走勢</h3><div class="note">淺色＝最近月份仍陸續登錄；直條標示所選月份</div><div class="chartbox"><canvas id="chart"></canvas></div></div>
    <div class="panel"><h3>當月產品結構</h3><div class="note" id="mixnote"></div><div id="mix"></div></div>
  </div>

  <div class="panel" style="margin-bottom:20px"><div class="ranks">
    <div><h3>行政區成交量排行</h3><div class="note">點行政區看完整分析</div><table id="volTbl"></table></div>
    <div><h3>行政區單價排行</h3><div class="note">中位單價 萬/坪</div><table id="priceTbl"></table></div>
  </div></div>

  <div class="foot" id="foot"></div>
</div>

<script>
let M=null,TYPE='presale',MONTH=null,chart=null;
const A=v=>v==null?'—':(+v).toFixed(1);
const N=v=>v==null?'—':(+v).toLocaleString();
const qs=new URLSearchParams(location.search);
const prevM=(m,k=1)=>{let[y,mo]=m.split('-').map(Number);mo-=k;while(mo<=0){mo+=12;y--;}return `${y}-${String(mo).padStart(2,'0')}`;};
const chg=(a,b)=>(a!=null&&b)?((a-b)/b*100):null;
const chgHtml=(p,inv)=>p==null?'<span class="flat">—</span>':`<span class="${(inv?-p:p)>0?'up':(inv?-p:p)<0?'down':'flat'}">${p>0?'+':''}${p.toFixed(1)}%</span>`;

fetch('data/market.json').then(r=>r.json()).then(d=>{M=d;
  document.getElementById('src').innerHTML=`資料來源：內政部實價登錄 · 更新 ${d.meta.updated_at} · 每旬本期＋季度封存合併`;
  init();
});
function incList(){return TYPE==='presale'?(M.meta.presale_incomplete||[]):(M.meta.resale_incomplete||[]);}
function compMonth(){return TYPE==='presale'?M.meta.presale_complete:M.meta.resale_complete;}
function init(){
  const months=M.meta.available_months.filter(m=>m>='2018-01').slice().reverse();
  document.getElementById('msel').innerHTML=months.map(m=>`<option value="${m}">${m.replace('-','年')}月</option>`).join('');
  MONTH=(qs.get('month')&&months.includes(qs.get('month')))?qs.get('month'):compMonth();
  if(qs.get('type')==='resale')TYPE='resale';
  document.getElementById('tPre').className=TYPE==='presale'?'on':'';document.getElementById('tRes').className=TYPE==='resale'?'on':'';
  document.getElementById('msel').value=MONTH;
  render();
}
function setType(t){TYPE=t;document.getElementById('tPre').className=t==='presale'?'on':'';document.getElementById('tRes').className=t==='resale'?'on':'';
  if(!M[TYPE].total[MONTH])MONTH=compMonth();document.getElementById('msel').value=MONTH;render();}
function pickMonth(m){MONTH=m;render();}

function render(){
  const T=M[TYPE], cur=T.total[MONTH], inc=incList().includes(MONTH);
  const prev=T.total[prevM(MONTH)], yago=T.total[prevM(MONTH,12)];
  document.getElementById('mbadge').innerHTML=inc?'<span class="badge inc">資料仍陸續登錄</span>':'<span class="badge ok">登錄完整</span>';
  history.replaceState(null,'',`?type=${TYPE}&month=${MONTH}`);
  if(!cur){document.getElementById('kpi').innerHTML='<p style="color:var(--sub)">本月尚無資料。</p>';document.getElementById('summary').innerHTML='';['mix','volTbl','priceTbl'].forEach(i=>document.getElementById(i).innerHTML='');drawChart();return;}
  const volMoM=chg(cur.n,prev&&prev.n), volYoY=chg(cur.n,yago&&yago.n), pYoY=chg(cur.unit_med,yago&&yago.unit_med);
  document.getElementById('kpi').innerHTML=`
    <div class="b"><div class="k">成交量${inc?'（登錄中）':''}</div><div class="v">${N(cur.n)}<small> 件</small></div><div class="s">較上月 ${chgHtml(volMoM)}${inc?'　<span style="color:var(--gold-d)">量能偏低屬正常</span>':''}</div></div>
    <div class="b"><div class="k">中位單價</div><div class="v">${A(cur.unit_med)}<small> 萬/坪</small></div><div class="s">較去年同期 ${chgHtml(pYoY)}</div></div>
    <div class="b"><div class="k">中位總價</div><div class="v">${N(cur.total_med)}<small> 萬</small></div><div class="s">${MONTH.replace('-','年')}月</div></div>
    <div class="b"><div class="k">最熱行政區</div><div class="v" style="font-size:22px">${hotDist()}</div><div class="s">當月成交最多</div></div>`;
  // 摘要文字
  const hot=distRank('n')[0];
  document.getElementById('summary').innerHTML=`${MONTH.replace('-','年')}月桃園${TYPE==='presale'?'預售屋':'中古屋'}成交 <b>${N(cur.n)}</b> 件，中位單價 <b>${A(cur.unit_med)}</b> 萬/坪${pYoY!=null?`，較去年同期${pYoY>0?'上漲':pYoY<0?'下修':'持平'} <b>${Math.abs(pYoY).toFixed(1)}%</b>`:''}；${hot?`以 <b>${hot.d}</b>（${hot.n} 件）為當月交易最集中的行政區`:''}。${inc?'（本月資料仍陸續登錄，成交量將持續增加。）':''}`;
  // 產品結構(當月)
  renderMix();
  // 排行
  const vr=distRank('n').slice(0,8), pr=distRank('unit_med').slice(0,8);
  const lnk=d=>`district.html?d=${encodeURIComponent(d)}&type=${TYPE}`;
  document.getElementById('volTbl').innerHTML='<tr><th>行政區</th><th class="n">成交件數</th><th class="n">中位單價</th></tr>'+
    vr.map((x,i)=>`<tr><td><span class="rk">${i+1}</span><a class="dl" href="${lnk(x.d)}">${x.d}</a></td><td class="n">${x.n}</td><td class="n">${A(x.unit_med)}</td></tr>`).join('');
  document.getElementById('priceTbl').innerHTML='<tr><th>行政區</th><th class="n">中位單價</th><th class="n">件數</th></tr>'+
    pr.map((x,i)=>`<tr><td><span class="rk">${i+1}</span><a class="dl" href="${lnk(x.d)}">${x.d}</a></td><td class="n">${A(x.unit_med)}</td><td class="n">${x.n}</td></tr>`).join('');
  drawChart();
  document.getElementById('foot').innerHTML=`口徑：單價為去車位單價換算萬/坪；月份可選，最近月份仍陸續登錄（依實際覆蓋量標示）。${TYPE==='resale'?'中古為乾淨行情（已排除交屋回補、特殊交易、非住宅）。':''} 完整月：預售 ${M.meta.presale_complete}、中古 ${M.meta.resale_complete}。`;
}
function distRank(key){
  const T=M[TYPE];const out=[];
  for(const d in T.dist){const s=T.dist[d][MONTH];if(s&&s.n>0)out.push({d,n:s.n,unit_med:s.unit_med});}
  return out.sort((a,b)=>(b[key]??-1)-(a[key]??-1));
}
function hotDist(){const r=distRank('n');return r.length?r[0].d:'—';}
function renderMix(){
  // 當月產品結構用 d12(近12月)近似，或當月資料不足時顯示近12月
  const d=M[TYPE].d12; // 全市無d12,改用snapshot type_mix(完整月)
  const mix=M[TYPE].snapshot.type_mix||[];
  document.getElementById('mixnote').textContent='完整月產品組成（'+M[TYPE].snapshot.vol_month+'）';
  document.getElementById('mix').innerHTML=mix.map(x=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><b>${x.t}</b><span>${x.pct}%　${x.n}件</span></div><div style="height:9px;background:var(--paper2);border-radius:5px;overflow:hidden"><div style="height:100%;width:${x.pct}%;background:linear-gradient(90deg,var(--navy),var(--gold))"></div></div></div>`).join('');
}
function drawChart(){
  const T=M[TYPE], inc=new Set(incList());
  const months=M.meta.available_months.filter(m=>m>='2023-07');
  const vol=months.map(m=>T.total[m]?T.total[m].n:null), price=months.map(m=>T.total[m]?T.total[m].unit_med:null);
  const colors=months.map(m=>m===MONTH?'#c15a2b':inc.has(m)?'#d9cdb0':'#24395a');
  document.getElementById('ctitle').textContent=(TYPE==='presale'?'預售屋':'中古屋')+' 成交量與中位單價走勢';
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('chart'),{data:{labels:months.map(m=>m.slice(2)),datasets:[
    {type:'bar',label:'成交量',data:vol,backgroundColor:colors,yAxisID:'y',order:2},
    {type:'line',label:'中位單價',data:price,borderColor:'#c9a663',borderWidth:2.5,pointRadius:0,tension:.3,yAxisID:'y1',order:1,spanGaps:true}
  ]},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{labels:{font:{family:'Noto Sans TC'},boxWidth:12}}},
    scales:{x:{ticks:{maxTicksLimit:12,font:{size:9}}},y:{position:'left',grid:{display:false},title:{display:true,text:'件'}},y1:{position:'right',grid:{drawOnChartArea:false},title:{display:true,text:'萬/坪'}}}}});
}
</script>
</body>
</html>
