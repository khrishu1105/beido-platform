<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>桃園成交行情 · 貝多房產</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--ink:#122238;--navy:#24395a;--gold:#c9a663;--gold-d:#9d7a38;--paper:#f6f2e8;--paper2:#efe8d9;--card:#fcfaf5;--line:#ddd4c2;--sub:#8a836f;--resale:#3f7d68}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans TC",sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
.serif{font-family:"Noto Serif TC",serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
a{color:inherit;text-decoration:none}
.nav{border-bottom:1px solid var(--line);background:rgba(246,242,232,.92);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{font-family:"Noto Serif TC",serif;font-weight:700;font-size:18px;letter-spacing:1px}
.brand span{color:var(--gold-d)}
.navlinks{display:flex;gap:24px;font-size:14px;color:var(--navy)}
.navlinks a.on{color:var(--gold-d);font-weight:700}
.head{padding:38px 0 8px}
.head h1{font-size:34px;font-weight:900;letter-spacing:1px}
.head h1 span{color:var(--gold-d)}
.head p{color:var(--sub);font-size:13.5px;margin-top:6px}
.tabs{display:flex;gap:0;margin:24px 0 20px;border:1px solid var(--line);border-radius:3px;width:fit-content;overflow:hidden}
.tabs button{padding:11px 26px;font-size:15px;font-weight:700;background:var(--card);border:none;cursor:pointer;color:var(--sub);font-family:inherit}
.tabs button.on{background:var(--ink);color:var(--paper)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px 22px}
.card .k{font-size:13px;color:var(--sub);margin-bottom:8px}
.card .v{font-family:"Noto Serif TC",serif;font-size:38px;font-weight:900;line-height:1}
.card .v small{font-size:15px;font-weight:600;color:var(--sub);margin-left:4px}
.card .sub{font-size:13px;color:var(--sub);margin-top:8px}
.up{color:#c0392b}.down{color:var(--resale)}.flat{color:var(--sub)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:22px 24px;margin-bottom:24px}
.panel h3{font-family:"Noto Serif TC",serif;font-size:18px;margin-bottom:4px}
.panel .note{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.chartbox{position:relative;height:320px}
.ranks{display:grid;grid-template-columns:1fr 1fr;gap:24px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--sub);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.rk{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;background:var(--paper2);color:var(--gold-d);border-radius:3px;font-size:12px;font-weight:700;margin-right:8px}
.foot{color:var(--sub);font-size:12.5px;padding:8px 0 50px;line-height:1.9}
@media(max-width:820px){.cards,.ranks{grid-template-columns:1fr}.navlinks{display:none}}
</style>
</head>
<body>
<nav class="nav"><div class="wrap">
  <a class="brand" href="index.html">貝多<span>房產</span> · 北北桃房市情報</a>
  <div class="navlinks"><a href="index.html">首頁</a><a href="index.html#cases">建案銷控</a><a class="on">成交行情</a><a href="index.html#report">房市觀測</a><a href="index.html#tools">房產工具</a></div>
</div></nav>

<div class="wrap">
  <div class="head">
    <h1 class="serif">桃園<span>成交行情</span></h1>
    <p id="meta">載入中…</p>
  </div>

  <div class="tabs">
    <button id="tPre" class="on" onclick="show('presale')">預售屋</button>
    <button id="tRes" onclick="show('resale')">中古屋（乾淨行情）</button>
  </div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <h3 id="chartTitle">成交量與中位單價走勢</h3>
    <div class="note" id="chartNote"></div>
    <div class="chartbox"><canvas id="chart"></canvas></div>
  </div>

  <div class="panel">
    <div class="ranks">
      <div><h3>行政區成交量 TOP</h3><div class="note" id="volNote"></div><table id="volTbl"></table></div>
      <div><h3>行政區單價 TOP</h3><div class="note">近3個月滾動中位（去車位）</div><table id="priceTbl"></table></div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
let M=null, TYPE='presale', chart=null;
const A=v=>v==null?'—':v.toFixed(1);
const trend=p=>p==null?'<span class="flat">—</span>':p>=5?`<span class="up">年增 ${p}%</span>`:p<=-5?`<span class="down">年減 ${Math.abs(p)}%</span>`:`<span class="flat">大致持平 (${p>0?'+':''}${p}%)</span>`;

fetch('data/market.json').then(r=>r.json()).then(d=>{M=d;
  document.getElementById('meta').innerHTML=`資料來源：內政部實價登錄 · 更新 ${d.meta.updated_at} · 量採完整月 ${d.meta.complete_month}、價採近3月滾動中位 · 中古已排除交屋回補/特殊/非住宅`;
  show('presale');
});

function show(t){
  TYPE=t;
  document.getElementById('tPre').className=t==='presale'?'on':'';
  document.getElementById('tRes').className=t==='resale'?'on':'';
  const s=M[t].snapshot, isRes=t==='resale';
  const vc=s.vol_vs_base_pct, vcls=vc>=8?'up':vc<=-8?'down':'flat';
  document.getElementById('cards').innerHTML=`
    <div class="card"><div class="k">中位單價（近3月滾動）</div><div class="v">${A(s.price_med)}<small>萬/坪</small></div><div class="sub">${trend(s.price_yoy)}　${s.price_n} 筆</div></div>
    <div class="card"><div class="k">成交量（${s.vol_month} 完整月）</div><div class="v">${s.vol_n}<small>件</small></div><div class="sub"><span class="${vcls}">較前3月均 ${vc>0?'+':''}${vc}%</span></div></div>
    <div class="card"><div class="k">本月最熱行政區</div><div class="v" style="font-size:30px">${s.hot.d}</div><div class="sub">${s.hot.n} 件　中位 ${A(s.hot.unit_med)} 萬/坪</div></div>`;
  // 排行
  document.getElementById('volNote').textContent=`${s.vol_month} 完整月`;
  const lnk=d=>`district.html?d=${encodeURIComponent(d)}&type=${TYPE}`;
  document.getElementById('volTbl').innerHTML='<tr><th>行政區</th><th class="n">成交件數</th><th class="n">中位單價</th></tr>'+
    s.vol_rank.map((x,i)=>`<tr><td><span class="rk">${i+1}</span><a href="${lnk(x.d)}" style="border-bottom:1px solid var(--line)">${x.d}</a></td><td class="n">${x.n}</td><td class="n">${A(x.unit_med)}</td></tr>`).join('');
  document.getElementById('priceTbl').innerHTML='<tr><th>行政區</th><th class="n">中位單價</th><th class="n">件數</th></tr>'+
    s.price_rank.map((x,i)=>`<tr><td><span class="rk">${i+1}</span><a href="${lnk(x.d)}" style="border-bottom:1px solid var(--line)">${x.d}</a></td><td class="n">${A(x.unit_med)}</td><td class="n">${x.n}</td></tr>`).join('');
  drawChart();
  document.getElementById('foot').innerHTML=`口徑說明：單價為去車位單價換算萬/坪，取近3個月滾動中位以抗登錄完整度與產品組成偏差；成交量採最後登錄完整月（最近1–2月仍陸續登錄，量能偏低屬正常）。${isRes?'「乾淨行情」已排除預售交屋回補（建商交屋予原預售買方之當年預售價）、特殊交易與非住宅，反映真實中古市場。':''} 實價登錄自成交至揭露約1–3個月落差。`;
}

function drawChart(){
  const total=M[TYPE].total, inc=new Set(M.meta.incomplete_months);
  const months=Object.keys(total).sort().slice(-36);
  const vol=months.map(m=>total[m].n), price=months.map(m=>total[m].unit_med);
  const barColors=months.map(m=>inc.has(m)?'#d9cdb0':'#24395a');
  document.getElementById('chartTitle').textContent=(TYPE==='presale'?'預售屋':'中古屋')+' 成交量與中位單價走勢（近3年）';
  document.getElementById('chartNote').innerHTML='淺色長條＝最近月份仍陸續登錄（量能偏低屬正常）';
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('chart'),{data:{labels:months,datasets:[
    {type:'bar',label:'成交量(件)',data:vol,backgroundColor:barColors,yAxisID:'y',order:2},
    {type:'line',label:'中位單價(萬/坪)',data:price,borderColor:'#c9a663',backgroundColor:'#c9a663',borderWidth:2.5,pointRadius:0,tension:.3,yAxisID:'y1',order:1}
  ]},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{labels:{font:{family:'Noto Sans TC'}}}},
    scales:{x:{ticks:{maxTicksLimit:12,font:{size:10}}},
      y:{position:'left',title:{display:true,text:'成交量'},grid:{display:false}},
      y1:{position:'right',title:{display:true,text:'中位單價 萬/坪'},grid:{drawOnChartArea:false}}}}});
}
</script>
</body>
</html>
